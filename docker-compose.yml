
services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: autoshop_db
    restart: always
    environment:
      POSTGRES_USER: autoshop_user
      POSTGRES_PASSWORD: autoshop_password
      POSTGRES_DB: autoshop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # pgAdmin (Optional but highly recommended for viewing your database visually)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: autoshop_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@autoshop.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
